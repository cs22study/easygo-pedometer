name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core-calc JVM unit tests
        run: ./gradlew :core-calc:test --stacktrace

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug & Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare named APK artifacts (arm64, arm32, universal)
        run: |
          TAG_OR_SHA="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/EasyGo-Pedometer-${TAG_OR_SHA}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "dist/EasyGo-Pedometer-${TAG_OR_SHA}-armeabi-v7a.apk"
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/EasyGo-Pedometer-${TAG_OR_SHA}-universal.apk"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: easygo-pedometer-apks
          path: dist/*.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.apk \
            --title "EasyGo-Pedometer ${GITHUB_REF_NAME}" \
            --notes "包含 **arm64-v8a**（主流 64 位元手機）、**armeabi-v7a**（arm32 位元舊款手機）與 **universal**（通用版）三種 APK，已通過全部單元測試並經 R8 瘦身與 v1+v2 雙重簽章。" \
            --prerelease
