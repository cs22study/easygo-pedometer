name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run core-calc JVM unit tests
        run: ./gradlew :core-calc:test --stacktrace

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build Debug & Release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Prepare named APK artifact
        run: |
          TAG_OR_SHA="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/EasyGo-Pedometer-${TAG_OR_SHA}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: easygo-pedometer-apk
          path: dist/*.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="dist/EasyGo-Pedometer-${GITHUB_REF_NAME}.apk"
          gh release create "${GITHUB_REF_NAME}" "${APK_FILE}" \
            --title "EasyGo-Pedometer ${GITHUB_REF_NAME} (測試版 APK)" \
            --notes "已通過全部單元測試並經 R8 瘦身優化（支援 Android 7.0+ / minSdk 24、v1+v2 雙重簽章）。若 OPPO 舊版系統安裝時仍卡在安全掃描轉圈，請暫時關閉 Wi-Fi/行動網路（離線安裝）即可秒裝。" \
            --prerelease
